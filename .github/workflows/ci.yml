name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore Revestik.sln

      - name: Build solution
        run: dotnet build Revestik.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test Revestik.sln --configuration Release --no-build --verbosity normal

      - name: Publish hosted application
        run: dotnet publish src/Revestik.Api/Revestik.Api.csproj --configuration Release --no-build --output artifacts/publish

      - name: Verify hosted Blazor assets
        run: |
          test -f artifacts/publish/wwwroot/index.html
          test -f artifacts/publish/wwwroot/_framework/blazor.webassembly.js
          find artifacts/publish/wwwroot/_framework -type f \( -name 'dotnet.runtime.*.js' -o -name 'dotnet.native.*.wasm' \) -print -quit | grep -q .
          find artifacts/publish/wwwroot/_framework -type f -name '*.br' -print -quit | grep -q .
